# Roda os testes offline do backend e do frontend a cada push e pull request.
# O GitHub só lê workflows da pasta .github/ da raiz; os de "Projeto final/*/.github/"
# continuam como estavam nos repositórios da equipe e não rodam aqui.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Projeto final/rag-grande-desafio-grupo04-cenario01
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Projeto final/rag-grande-desafio-grupo04-cenario01/requirements-lock.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      # Os testes marcados com "llm" chamam o servidor da turma e ficam de fora;
      # os demais não usam .env, Postgres nem o modelo de rerank (ver tests/conftest.py).
      - name: Rodar testes offline
        run: python -m pytest tests/ -m "not llm" -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Projeto final/frontendRAG
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projeto final/frontendRAG/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Checar tipos e gerar build
        run: npm run build

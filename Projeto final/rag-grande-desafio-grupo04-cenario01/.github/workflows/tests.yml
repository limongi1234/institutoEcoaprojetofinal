# Roda a suíte offline a cada push e pull request.
# Os testes marcados com "llm" chamam o servidor da turma e ficam de fora;
# os demais não usam .env, Postgres nem o modelo de rerank (ver tests/conftest.py).
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Rodar testes offline
        run: python -m pytest tests/ -m "not llm" -q
